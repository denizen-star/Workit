<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 80" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242428" />
      <stop offset="100%" stop-color="#0a0a0c" />
    </linearGradient>
    <linearGradient id="strap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a35d52" />
      <stop offset="100%" stop-color="#a35d52" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="buckle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8c547" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#e8c547" />
    </linearGradient>
  </defs>
  
  <!-- Base Plaque -->
  <rect x="8" y="16" width="144" height="48" rx="12" fill="url(#bg)" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.15" />
  
  <!-- Belt Strap -->
  <rect x="8" y="28" width="144" height="24" fill="url(#strap)" />
  <line x1="8" y1="28" x2="152" y2="28" stroke="#FFFFFF" stroke-width="1" opacity="0.3" />
  <line x1="8" y1="52" x2="152" y2="52" stroke="#000000" stroke-width="1" opacity="0.5" />
  
  <!-- Buckle Outer -->
  <rect x="64" y="20" width="32" height="40" rx="6" fill="url(#buckle)" stroke="#000000" stroke-width="2" stroke-opacity="0.5" />
  
  <!-- Buckle Inner Hole -->
  <rect x="72" y="28" width="16" height="24" rx="3" fill="#121214" stroke="#000000" stroke-width="1" />
  <rect x="72" y="28" width="16" height="24" rx="3" fill="url(#strap)" />
  
  <!-- Buckle Prong -->
  <rect x="84" y="38" width="12" height="4" rx="2" fill="#FFFFFF" opacity="0.9" />
</svg>