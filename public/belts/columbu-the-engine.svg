<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 80" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242428" />
      <stop offset="100%" stop-color="#0a0a0c" />
    </linearGradient>
    <linearGradient id="strap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8c547" />
      <stop offset="100%" stop-color="#e8c547" stop-opacity="0.6" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8c547" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#e8c547" stop-opacity="0" />
    </radialGradient>
    <filter id="icon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#e8c547" flood-opacity="0.8"/>
    </filter>
  </defs>
  
  <!-- Base Plaque -->
  <rect x="8" y="16" width="144" height="48" rx="12" fill="url(#bg)" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.15" />
  
  <!-- Belt Strap -->
  <rect x="8" y="28" width="144" height="24" fill="url(#strap)" />
  <line x1="8" y1="28" x2="152" y2="28" stroke="#FFFFFF" stroke-width="1" opacity="0.3" />
  <line x1="8" y1="52" x2="152" y2="52" stroke="#000000" stroke-width="1" opacity="0.5" />
  
  <!-- Center Championship Buckle Background -->
  <circle cx="80" cy="40" r="22" fill="#121214" stroke="#e8c547" stroke-width="2" />
  <circle cx="80" cy="40" r="18" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.1" stroke-dasharray="2 2" />
  <circle cx="80" cy="40" r="22" fill="url(#glow)" />
  
  <!-- Cartoon / Icon -->
  <g transform="translate(64, 24)" color="#e8c547" fill="none" filter="url(#icon-glow)">
<circle cx="16" cy="16" r="6" stroke="currentColor" stroke-width="2"/><path d="M 16 6 L 16 2 M 16 26 L 16 30 M 6 16 L 2 16 M 26 16 L 30 16 M 9 9 L 6 6 M 23 23 L 26 26 M 9 23 L 6 26 M 23 9 L 26 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>