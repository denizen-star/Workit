  <!-- Glow -->
  <circle cx="64" cy="64" r="48" fill="url(#glow-silver-iron.svg)" />
  
  <!-- Icon Group -->
  <g transform="translate(32, 32)" color="#c5c5c5" fill="none" filter="url(#icon-glow)">
    <path d="M 24 32 L 24 20 C 24 12 40 12 40 20 L 40 32" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><circle cx="32" cy="42" r="14" stroke="currentColor" stroke-width="3"/>
