      <stop offset="0%" stop-color="#c5c5c5" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#c5c5c5" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bg-silver-iron.svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242428" />
      <stop offset="100%" stop-color="#0a0a0c" />
    </linearGradient>
    <filter id="icon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#c5c5c5" flood-opacity="0.6"/>
