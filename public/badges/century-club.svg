<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <radialGradient id="glow-century-club.svg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c9a6ff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#c9a6ff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bg-century-club.svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242428" />
      <stop offset="100%" stop-color="#0a0a0c" />
    </linearGradient>
    <filter id="icon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#c9a6ff" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Base Background -->
  <circle cx="64" cy="64" r="56" fill="url(#bg-century-club.svg)" />
  
  <!-- Outer Border -->
  <circle cx="64" cy="64" r="56" stroke="#c9a6ff" stroke-width="2" stroke-opacity="0.8" />
  
  <!-- Inner Ring -->
  <circle cx="64" cy="64" r="48" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.1" stroke-dasharray="4 4" />
  
  <!-- Glow -->
  <circle cx="64" cy="64" r="48" fill="url(#glow-century-club.svg)" />
  
  <!-- Icon Group -->
  <g transform="translate(32, 32)" color="#c9a6ff" fill="none" filter="url(#icon-glow)">
    <text x="32" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="700" fill="currentColor" stroke="none" text-anchor="middle">100</text>
  </g>
</svg>