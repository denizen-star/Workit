<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <radialGradient id="glow-picky-twenty-five.svg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8c547" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#e8c547" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bg-picky-twenty-five.svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242428" />
      <stop offset="100%" stop-color="#0a0a0c" />
    </linearGradient>
    <filter id="icon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#e8c547" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base Background -->
  <circle cx="64" cy="64" r="56" fill="url(#bg-picky-twenty-five.svg)" />

  <!-- Outer Border -->
  <circle cx="64" cy="64" r="56" stroke="#e8c547" stroke-width="2" stroke-opacity="0.8" />

  <!-- Inner Ring -->
  <circle cx="64" cy="64" r="48" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.1" stroke-dasharray="4 4" />

  <!-- Glow -->
  <circle cx="64" cy="64" r="48" fill="url(#glow-picky-twenty-five.svg)" />

  <!-- Icon Group (Your pick badge — database/migrate-your-pick.sql) -->
  <g transform="translate(32, 32)" color="#e8c547" fill="none" filter="url(#icon-glow)">
    <rect x="8" y="16" width="36" height="36" rx="8" stroke="currentColor" stroke-width="3"/>
    <circle cx="18" cy="26" r="3" fill="currentColor"/>
    <circle cx="26" cy="34" r="3" fill="currentColor"/>
    <circle cx="34" cy="42" r="3" fill="currentColor"/>
    <text x="50" y="58" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="16" fill="currentColor">25</text>
  </g>
</svg>
