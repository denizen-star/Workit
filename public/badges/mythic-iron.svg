<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <radialGradient id="glow-mythic-iron.svg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c9a6ff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#c9a6ff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bg-mythic-iron.svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242428" />
      <stop offset="100%" stop-color="#0a0a0c" />
    </linearGradient>
    <filter id="icon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#c9a6ff" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Base Background -->
  <circle cx="64" cy="64" r="56" fill="url(#bg-mythic-iron.svg)" />
  
  <!-- Outer Border -->
  <circle cx="64" cy="64" r="56" stroke="#c9a6ff" stroke-width="2" stroke-opacity="0.8" />
  
  <!-- Inner Ring -->
  <circle cx="64" cy="64" r="48" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.1" stroke-dasharray="4 4" />
  
  <!-- Glow -->
  <circle cx="64" cy="64" r="48" fill="url(#glow-mythic-iron.svg)" />
  
  <!-- Icon Group -->
  <g transform="translate(32, 32)" color="#c9a6ff" fill="none" filter="url(#icon-glow)">
    <rect x="16" y="22" width="6" height="20" rx="2" stroke="currentColor" stroke-width="3"/><rect x="42" y="22" width="6" height="20" rx="2" stroke="currentColor" stroke-width="3"/><line x1="22" y1="32" x2="42" y2="32" stroke="currentColor" stroke-width="3"/>
  </g>
