<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Belt wash samples</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 28px 22px 40px;
      background: #07070a;
      color: #f6f1e3;
      font-family: ui-sans-serif, system-ui, sans-serif;
    }
    h1 { margin: 0 0 6px; font-size: 22px; }
    .sub { margin: 0 0 22px; color: rgba(246,241,227,0.62); font-size: 14px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }
    .belt-session {
      min-height: 280px;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .glass-header {
      padding: 14px 16px 12px;
      backdrop-filter: blur(22px);
    }
    .belt-session .glass-header {
      background: color-mix(in srgb, rgb(var(--belt-rgb)) 36%, rgba(7, 7, 10, 0.78));
      border-bottom: 1px solid rgb(var(--belt-rgb) / 0.55);
    }
    .weeks { font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #e8c547; }
    .name { margin: 4px 0 0; font-size: 18px; font-weight: 900; }
    .you { margin-top: 2px; font-size: 12px; color: rgba(246,241,227,0.6); }
    .pad { padding: 16px; }
    .glass-card {
      border-radius: 1.25rem;
      padding: 14px 16px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }
    .belt-session .glass-card {
      border: 1px solid rgb(var(--belt-rgb) / 0.42);
      background: linear-gradient(
        180deg,
        color-mix(in srgb, rgb(var(--belt-rgb)) 18%, rgba(255, 255, 255, 0.08)),
        color-mix(in srgb, rgb(var(--belt-rgb)) 10%, rgba(255, 255, 255, 0.03))
      );
    }
    .lift { font-size: 16px; font-weight: 800; }
    .target { margin-top: 4px; font-size: 13px; color: rgba(246,241,227,0.65); }
    .swatch {
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: rgba(246,241,227,0.7);
    }
    .dot { width: 14px; height: 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.2); }
  </style>
</head>
<body>
  <h1>Live session belt wash</h1>
  <p class="sub">Same fills and wash math as the workout page. Kevin today is the first card.</p>
  <div class="grid" id="grid"></div>
  <script>
    const belts = [
      { weeks: 2, name: 'Dipping your toes', fill: '#f6f1e3', paper: 'light', you: 'Kevin now' },
      { weeks: 6, name: 'Got back in the saddle', fill: '#b7e1b5', paper: 'light' },
      { weeks: 10, name: 'I see you getting stronger', fill: '#6d8b6e', paper: 'dark' },
      { weeks: 20, name: 'Steady', fill: '#E6D385', paper: 'light' },
      { weeks: 24, name: 'Weigh-up sprint', fill: '#d4894a', paper: 'dark' },
      { weeks: 48, name: 'Arnold Status', fill: '#1a1a1a', paper: 'dark' },
    ];

    function wash(belt) {
      const light = belt.paper === 'light';
      const glow = light ? 0.55 : 0.42;
      const veil = light ? 0.22 : 0.24;
      const raw = belt.fill.replace('#', '');
      const n = raw.length === 3 ? raw.split('').map((c) => c + c).join('') : raw;
      const r = parseInt(n.slice(0, 2), 16);
      const g = parseInt(n.slice(2, 4), 16);
      const b = parseInt(n.slice(4, 6), 16);
      return {
        rgb: `${r} ${g} ${b}`,
        background: [
          `radial-gradient(140% 90% at 50% 12%, rgba(${r},${g},${b},${glow}), transparent 68%)`,
          `rgba(${r},${g},${b},${veil})`,
          '#07070a',
        ].join(', '),
      };
    }

    document.getElementById('grid').innerHTML = belts.map((belt) => {
      const w = wash(belt);
      return `
        <article class="belt-session" style="background:${w.background};--belt-rgb:${w.rgb}">
          <header class="glass-header">
            <div class="weeks">${belt.weeks} locked weeks</div>
            <h2 class="name">${belt.name}</h2>
            ${belt.you ? `<div class="you">${belt.you}</div>` : ''}
          </header>
          <div class="pad">
            <div class="glass-card">
              <div class="lift">Week 7 · Extra Upper</div>
              <div class="target">This is the live log. Cards and header take the belt tint.</div>
              <div class="swatch">
                <span class="dot" style="background:${belt.fill}"></span>
                Fill ${belt.fill}
              </div>
            </div>
          </div>
        </article>
      `;
    }).join('');
  </script>
</body>
</html>
