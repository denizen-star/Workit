<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Work-It">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1f"/>
      <stop offset="45%" stop-color="#0a0a0c"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d76e"/>
      <stop offset="45%" stop-color="#e8c547"/>
      <stop offset="100%" stop-color="#b8922a"/>
    </linearGradient>
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff4c2" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#e8c547" stop-opacity="0"/>
      <stop offset="100%" stop-color="#8a6a12" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="rounded">
      <rect width="512" height="512" rx="112"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <circle cx="140" cy="110" r="180" fill="#e8c547" opacity="0.10"/>
    <circle cx="400" cy="420" r="160" fill="#e8c547" opacity="0.07"/>
    <rect width="512" height="512" fill="url(#glass)"/>
    <path d="M0 0 H512 V180 C380 140 180 90 0 120 Z" fill="#ffffff" opacity="0.06"/>
  </g>

  <g transform="translate(256 256) rotate(-38) translate(-256 -256)" filter="url(#softGlow)">
    <rect x="156" y="236" width="200" height="40" rx="12" fill="url(#gold)"/>
    <rect x="156" y="236" width="200" height="18" rx="9" fill="url(#goldShine)"/>
    <rect x="108" y="198" width="36" height="116" rx="10" fill="url(#gold)"/>
    <rect x="78" y="214" width="28" height="84" rx="9" fill="url(#gold)"/>
    <rect x="56" y="230" width="22" height="52" rx="8" fill="url(#gold)"/>
    <rect x="108" y="198" width="36" height="40" rx="10" fill="url(#goldShine)"/>
    <rect x="78" y="214" width="28" height="28" rx="9" fill="url(#goldShine)"/>
    <rect x="368" y="198" width="36" height="116" rx="10" fill="url(#gold)"/>
    <rect x="406" y="214" width="28" height="84" rx="9" fill="url(#gold)"/>
    <rect x="434" y="230" width="22" height="52" rx="8" fill="url(#gold)"/>
    <rect x="368" y="198" width="36" height="40" rx="10" fill="url(#goldShine)"/>
    <rect x="406" y="214" width="28" height="28" rx="9" fill="url(#goldShine)"/>
  </g>

  <rect x="10" y="10" width="492" height="492" rx="102" fill="none" stroke="#e8c547" stroke-opacity="0.28" stroke-width="3"/>
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
</svg>
