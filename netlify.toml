[[plugins]]
  package = "@netlify/plugin-nextjs"

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

# workit.kervinapps.com is a different hostname — Netlify UI has no
# "redirect to primary" for it (only apex ↔ www). Keep that domain
# assigned to this site or these rules never run.
[[redirects]]
  from = "https://workit.kervinapps.com/*"
  to = "https://workitapp.fit/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://workit.kervinapps.com/*"
  to = "https://workitapp.fit/:splat"
  status = 301
  force = true
